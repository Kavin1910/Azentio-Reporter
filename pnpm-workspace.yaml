packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 spelling. Both keys kept so older CLIs read the same intent.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# Scripts were being blocked by the pre-run "deps status" install check
# tripping on the build-approval warning; the check adds nothing here.
verifyDepsBeforeRun: false
